<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel de Imágenes con Bootstrap</title>
  <!-- Agregar el enlace a la hoja de estilos de Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center">Carrusel de Imágenes</h1>

    <!-- Carrusel -->
    <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
            <!-- Primer imagen -->
            <div class="carousel-item active">
            <img src="./img/Arroz-frito-chino-con-verduras.jpg" class="d-block w-100" alt="Imagen 1">
            </div>
            <!-- Segunda imagen -->
            <div class="carousel-item">
            <img src="./img/bolas-de-pescado.jpg" class="d-block w-100" alt="Imagen 2">
            </div>
            <!-- Tercera imagen -->
            <div class="carousel-item">
            <img src="./img/Cerdo-agridulce.jpg" class="d-block w-100" alt="Imagen 3">
            </div>

            <div class="carousel-item">
                <img src="./img/chopsuey.jpeg" class="d-block w-100" alt="Imagen 3">
            </div>
            <div class="carousel-item">
                <img src="./img/image.png" class="d-block w-100" alt="Imagen 3">
            </div>
        </div>
        
      <!-- Controles para mover el carrusel -->
      <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Anterior</span>
      </a>
      <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Siguiente</span>
      </a>
    </div>
  </div>

  <!-- Agregar los scripts de Bootstrap -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
